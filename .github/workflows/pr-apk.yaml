name: PR APK

# Actions budget: a PR's staging debug APK is built only
# when the PR carries the "apk" label (added when a head goes to the tester or
# is CLEAN and about to merge), or on a manual run (workflow_dispatch on the
# branch). Never automatically: no gate job either, so a PR without the label
# starts no runner at all (a skipped job costs no minutes). A native change
# (android/, ios/, pubspec.*) gets the label before merge; master pushes still
# build in ci.yaml. Kept out of ci.yaml so label events never create
# (skipped = "success") copies of the required check.
on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]
  workflow_dispatch:

# Another label's event gets its own group, so it never cancels a real build.
concurrency:
  group: pr-apk-${{ github.ref }}-${{ (github.event.action != 'labeled' || github.event.label.name == 'apk') && 'build' || 'other' }}
  cancel-in-progress: true

jobs:
  apk:
    name: staging debug APK
    # Labelled PR: every new head rebuilds; another label never does.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'apk') &&
       (github.event.action != 'labeled' || github.event.label.name == 'apk'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The runner's ~14 GB disk fills during the native-lib strip.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      # Gradle's downloads from ci.yaml's master runs (see the cache steps
      # there), restored only: a PR's build never saves.
      - name: Gradle's downloads (restore only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-apk-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-apk-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter build apk --debug --flavor staging --dart-define-from-file=env/staging.json
      # What the tester's rows read from the log, without downloading the APK:
      # the package, label and version; every permission, diffed against
      # android/expected-permissions.txt (the release list) plus
      # android/debug-only-permissions.txt (the network, which only debug and
      # profile builds keep; the staging package's own permission read as the
      # store package's); the manifest's backup attributes.
      - name: The APK's facts (badging, permissions, backup)
        run: |
          APK=build/app/outputs/flutter-apk/app-staging-debug.apk
          AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"
          echo "== badging"
          "$AAPT2" dump badging "$APK" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion):"
          "$AAPT2" dump permissions "$APK" \
            | sed -nE "s/^uses-permission(-sdk-23)?: name='([^']+)'.*/\2/p" \
            | sed 's/^com\.burrowsoft\.piggybow\.staging\./com.burrowsoft.piggybow./' \
            | sort -u > permissions.txt
          echo "== permissions"; cat permissions.txt
          diff <(sort android/expected-permissions.txt android/debug-only-permissions.txt) permissions.txt
          echo "== backup"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" \
            | grep -E 'allowBackup|fullBackupContent|dataExtractionRules'
      # No APK is uploaded (the repo is public): a run that needs one builds it.
