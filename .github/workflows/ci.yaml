name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to a PR cancels its older run; master runs are never cancelled,
# so every merge commit keeps its own check + APK.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Budget: analyze + test are skipped on a docs-only PR (*.md), and the
  # tracker check runs only when what Gradle resolves can change (android/,
  # pubspec) or a workflow does (it may change how Gradle runs). Not
  # paths-ignore: a workflow skipped by a path filter leaves the required check
  # "Expected" forever, while a skipped job counts as passed.
  changes:
    name: what changed?
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      app: ${{ steps.c.outputs.app }}
      deps: ${{ steps.c.outputs.deps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: c
        run: |
          deps_in() { if echo "$1" | grep -qE '^(android/|pubspec\.(yaml|lock)$|\.github/workflows/)'; then echo true; else echo false; fi; }
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # A master push or a manual run: everything.
            echo "app=true" >> "$GITHUB_OUTPUT"; echo "deps=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          echo "deps=$(deps_in "$files")" >> "$GITHUB_OUTPUT"
          code=$(echo "$files" | grep -vE '\.md$' || true)
          if [ -n "$files" ] && [ -z "$code" ]; then
            echo "app=false" >> "$GITHUB_OUTPUT"; echo "docs only: analyze + test skipped"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: analyze + test + l10n
    needs: changes
    # Fail open: if the paths check itself failed, run anyway.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: l10n parity (every shipped ARB matches app_en.arb)
        run: dart run tool/check_l10n.dart
      - name: no hard-coded user-facing text
        run: dart run tool/check_hardcoded_text.dart
      - name: no-guilt copy (banned phrases in app_en.arb)
        run: dart run tool/no_guilt.dart
      - name: no hidden characters (bidi controls, zero-width, stray no-break spaces)
        run: dart run tool/check_hidden_chars.dart
      - name: l10n untranslated messages
        run: |
          flutter gen-l10n
          if [ -s build/untranslated.json ] && [ "$(tr -d ' \n' < build/untranslated.json)" != "{}" ]; then
            echo "Untranslated messages:"; cat build/untranslated.json; exit 1
          fi
      - run: flutter analyze
      # Every test by name, and a JSON report for the counts below.
      - run: flutter test --coverage --reporter expanded --file-reporter json:build/test-report.json
      # Per-test counts in the job summary: passed, failed, skipped, with
      # every skipped test named (a green job doesn't mean a test ran).
      - name: test counts
        if: ${{ !cancelled() }}
        run: node tool/test_counts.mjs build/test-report.json | tee -a "$GITHUB_STEP_SUMMARY"
      # Line coverage (total) in the job summary. Reports only, never fails.
      # No artifacts: the repo is public (only release-aab keeps its AAB).
      - name: coverage summary
        run: dart run tool/coverage_summary.dart >> "$GITHUB_STEP_SUMMARY"

  # No trackers in what ships, on every PR that can change the release
  # classpath (android/, pubspec) or a workflow, not only at release. No full build:
  # --config-only writes the Gradle wrapper and settings.
  trackers:
    name: no tracking dependencies
    runs-on: ubuntu-latest
    needs: changes
    # Fail open, as the app job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.deps == 'true') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      # Gradle's downloads, so a run asks Maven only for what's new (Maven
      # Central answers busy runners with 429s). The key is what decides them:
      # the Gradle files and pubspec.lock (the plugins' Android dependencies,
      # which setup-java's gradle cache left out). After a miss, the newest
      # older entry is restored and only the difference is downloaded.
      # Only ci.yaml saves: on master, from merged code; on a PR, into that
      # PR's own scope, which master and the other workflows can't read. The
      # emulator, PR APK and release workflows restore the apk job's entries
      # and never save.
      - name: Gradle's downloads (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-trackers-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-trackers-
            gradle-${{ runner.os }}-apk-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter build apk --config-only --flavor staging
      - name: verifyNoTrackingDeps
        working-directory: android
        # A dependency report needs little heap; android/gradle.properties'
        # -Xmx8G is more than the runner has.
        run: ./gradlew --no-daemon verifyNoTrackingDeps -Dorg.gradle.jvmargs=-Xmx2g
      # A release build sends nothing (src/release/AndroidManifest.xml removes
      # the network permissions): its merged manifest asks for exactly
      # android/expected-permissions.txt, the list the Play upload is checked
      # against. The staging release has the same manifest; a prod task needs
      # the upload key, which only the Release AAB workflow has.
      - name: Release permissions = android/expected-permissions.txt
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:processStagingReleaseMainManifest -Dorg.gradle.jvmargs=-Xmx2g
          m=$(find ../build/app/intermediates -path '*merged_manifest*' -path '*stagingRelease*' -name AndroidManifest.xml | head -1)
          test -n "$m" || { echo "no merged staging release manifest" >&2; exit 1; }
          echo "merged manifest: $m"
          tr '\n' ' ' < "$m" \
            | grep -oE '<uses-permission(-sdk-23)?[^>]*>' \
            | sed -nE 's/.*android:name="([^"]+)".*/\1/p' \
            | sed 's/^com\.burrowsoft\.piggybow\.staging\./com.burrowsoft.piggybow./' \
            | sort -u > "$RUNNER_TEMP/release-permissions.txt"
          cat "$RUNNER_TEMP/release-permissions.txt"
          diff <(sort expected-permissions.txt) "$RUNNER_TEMP/release-permissions.txt"

  # Master pushes only; a PR's APK comes from pr-apk.yaml ("apk" label).
  apk:
    name: staging debug APK
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    timeout-minutes: 30
    steps:
      # The runner's ~14 GB disk fills during the native-lib strip.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      # As in the trackers job. This job runs on master pushes only, so its
      # entries (a full debug build's downloads) come from merged code: the
      # ones the emulator, PR APK and release workflows restore.
      - name: Gradle's downloads (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-apk-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-apk-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      # Builds only: no APK is uploaded (the repo is public).
      - run: flutter build apk --debug --flavor staging --dart-define-from-file=env/staging.json
