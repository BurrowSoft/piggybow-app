# CI's one Flutter, set up without a third-party action, so no action runs
# anything by tag. Every run checks the SDK it uses: a download against the
# sha256 that Flutter's release list (releases_linux.json) gives for the
# archive, and the SDK, downloaded or cached, against the release's revision,
# its tracked files included.
#
# cache "true" keeps the SDK and the pub cache between runs, with the pinned
# actions/cache: the SDK keyed on its release and the archive's sha256, the
# packages on the lockfile. It's off by default, and the release job leaves
# it off: that job downloads and checks the SDK every time.
#
# A workflow uses it from its own commit: ./.github/actions/flutter, or
# ./ci/.github/actions/flutter where the root holds another commit.
name: Flutter
description: Flutter from its own archive, checked by sha256, on PATH.
inputs:
  cache:
    description: '"true" restores and saves the SDK and the pub cache.'
    required: false
    default: "false"
  lockfile:
    description: The pubspec.lock that keys the pub cache.
    required: false
    default: pubspec.lock
runs:
  using: composite
  steps:
    # The release: its archive, the archive's sha256 and the release's
    # revision, as releases_linux.json lists them.
    - name: The release
      id: sdk
      shell: bash
      run: |
        version=3.47.5
        {
          echo "version=$version"
          echo "archive=stable/linux/flutter_linux_$version-stable.tar.xz"
          echo "sha256=2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb"
          echo "revision=6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "dir=$RUNNER_TOOL_CACHE/flutter/$version"
        } >> "$GITHUB_OUTPUT"
    - name: The SDK, from the cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.sdk.outputs.dir }}
        key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.version }}-${{ steps.sdk.outputs.sha256 }}
    - name: The packages, from the cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pub-cache
        key: flutter-pub-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.version }}-${{ hashFiles(inputs.lockfile) }}
    - name: The SDK
      shell: bash
      env:
        DIR: ${{ steps.sdk.outputs.dir }}
        ARCHIVE: ${{ steps.sdk.outputs.archive }}
        SHA256: ${{ steps.sdk.outputs.sha256 }}
        REVISION: ${{ steps.sdk.outputs.revision }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != Linux ] || [ "$RUNNER_ARCH" != X64 ]; then
          echo "::error::The archive is Flutter's Linux x64 one; this runner is $RUNNER_OS $RUNNER_ARCH."
          exit 1
        fi
        if [ ! -x "$DIR/flutter/bin/flutter" ]; then
          curl -fsSL -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          mkdir -p "$DIR"
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$DIR"
          rm -f "$RUNNER_TEMP/flutter.tar.xz"
        fi
        head=$(git -C "$DIR/flutter" rev-parse HEAD)
        if [ "$head" != "$REVISION" ]; then
          echo "::error::The SDK is at $head, not the release's revision $REVISION."
          exit 1
        fi
        # And its tracked files are that revision's, cached or not. (The
        # ignored bin/cache isn't covered by this.)
        if ! git -C "$DIR/flutter" diff --quiet HEAD --; then
          echo "::error::The SDK's tracked files differ from its revision's:"
          git -C "$DIR/flutter" status --porcelain --untracked-files=no | head -20
          exit 1
        fi
        {
          echo "FLUTTER_ROOT=$DIR/flutter"
          echo "PUB_CACHE=$HOME/.pub-cache"
        } >> "$GITHUB_ENV"
        {
          echo "$DIR/flutter/bin"
          echo "$DIR/flutter/bin/cache/dart-sdk/bin"
          echo "$HOME/.pub-cache/bin"
        } >> "$GITHUB_PATH"
        "$DIR/flutter/bin/flutter" --version
