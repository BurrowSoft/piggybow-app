# CI emulators sometimes show another app's "… isn't responding" dialog (the
# system launcher's, seen on master dfec61d), which covers Piggybow and hides
# its ids. Tap "Wait" on it, but ONLY when the dialog isn't Piggybow's own:
# an ANR of our app must still fail the flow.
appId: ${APP_ID}
---
- runFlow:
    when:
      visible:
        id: "android:id/aerr_wait"
      notVisible: ".*Piggybow.*"
    commands:
      - takeScreenshot: system-anr-dismissed
      - tapOn:
          id: "android:id/aerr_wait"
