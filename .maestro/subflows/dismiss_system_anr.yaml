# CI emulators sometimes show ANOTHER app's "<app> isn't responding" dialog
# (the system launcher's, seen on master dfec61d and 668df2b), which covers
# Piggybow and hides its ids. "Wait" is not enough: the launcher stays hung
# and the dialog comes back within seconds (668df2b). So tap "Close app",
# which ends the hung app, and only when the dialog's title names another app:
# an ANR of Piggybow itself must still fail the flow.
# Each time it fires it leaves evidence: the "system-anr-closed" screenshot,
# and the tap on android:id/aerr_close in commands.json.
appId: ${APP_ID}
---
- runFlow:
    when:
      visible:
        id: "android:id/alertTitle"
        text: "(?i)(?!.*piggybow).+ isn.t responding"
    commands:
      - takeScreenshot: system-anr-closed
      - tapOn:
          id: "android:id/aerr_close"
