# From Home: add one entry of ${AMOUNT} on another day through the Add sheet's
# day picker; back on Home after it. SEG: add-seg-spent or add-seg-saved;
# CAT: a category id for a spend, or "none" for a save; DAY: the calendar
# day's full date as the picker reads it out, e.g. "Monday, November 23, 2026".
# env: SEG, AMOUNT, CAT, DAY
appId: ${APP_ID}
---
- tapOn:
    id: home-add
- tapOn:
    id: ${SEG}
- runFlow:
    file: paste_into.yaml
    env:
      ID: add-amount
      TEXT: ${AMOUNT}
      EXPECT: ".*${AMOUNT}.*"
- runFlow:
    when:
      true: ${CAT != "none"}
    commands:
      - runFlow:
          file: reveal.yaml
          env:
            ID: add-cat-${CAT}
      - tapOn:
          id: add-cat-${CAT}
- runFlow:
    file: reveal.yaml
    env:
      ID: add-date
- tapOn:
    id: add-date
- tapOn: ".*${DAY}.*"
- tapOn: "OK"
- runFlow:
    file: reveal.yaml
    env:
      ID: add-submit
- tapOn:
    id: add-submit
- extendedWaitUntil:
    visible:
      id: home-add
    timeout: 10000
