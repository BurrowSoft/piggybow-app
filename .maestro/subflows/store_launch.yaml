# The store screenshots' start: a clean state, then the app launched with the
# CASE fixture (STORE1 or STORE2; staging builds only), clock frozen at the
# case's now. The clear runs as its own step before the launch. The fixtures
# mark the reminder offer answered, so Home opens on the pig, the goal, the
# week and the tip (flow 60 asserts the offer is absent).
# env: CASE
appId: ${APP_ID}
---
- retry:
    maxRetries: 1
    commands:
      - stopApp
      - clearState
      - waitForAnimationToEnd:
          timeout: 2000
      - launchApp:
          permissions:
            notifications: deny
          arguments:
            route: "/fixture/${CASE}"
      - extendedWaitUntil:
          visible:
            id: "home-pig|fixture-error"
          timeout: 120000
- assertNotVisible:
    id: fixture-error
- waitForAnimationToEnd
