# The store screenshots' start: a clean state, then the app launched with the
# CASE fixture (STORE1 or STORE2; staging builds only), clock frozen at the
# case's now. The clear runs as its own step before the launch. If Home shows
# the reminder offer (the fixtures don't answer it), it's answered "No thanks"
# so the shot shows the week and the idea.
# env: CASE
appId: ${APP_ID}
---
- retry:
    maxRetries: 1
    commands:
      - stopApp
      - clearState
      - waitForAnimationToEnd:
          timeout: 2000
      - launchApp:
          permissions:
            notifications: deny
          arguments:
            route: "/fixture/${CASE}"
      - extendedWaitUntil:
          visible:
            id: "home-pig|fixture-error"
          timeout: 120000
- assertNotVisible:
    id: fixture-error
- runFlow:
    when:
      visible:
        id: home-reminder-no
    commands:
      - tapOn:
          id: home-reminder-no
- waitForAnimationToEnd
