# In Android's file picker (DocumentsUI), opened by the app: go to Downloads
# and pick the file whose name contains ${FILE}. The row script pushes the
# file to /sdcard/Download and asks the media scanner for it first.
# env: FILE (a part of the file name, regex-safe)
appId: ${APP_ID}
---
- waitForAnimationToEnd:
    timeout: 3000
# The roots drawer, unless the picker already shows Downloads
- tapOn:
    text: "Show roots"
    optional: true
- tapOn:
    text: "Downloads"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: ".*${FILE}.*"
