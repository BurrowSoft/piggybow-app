appId: ${APP_ID}
name: The home-screen widget (#72, group D) - from Pixel Launcher's widget picker, place Piggybow's widget (its default 3×2), read it, and tap it open
tags: [widget]
# Run by group-d.sh with kind=plus-owned (Plus on: the data faces) or
# plus-rows (Plus enabled but off: "Part of Plus"). The launcher's own steps
# are tried tolerantly; the first dry run shows which of them this image uses.
# env: EXPECT (a regex the widget must show), SHOT
---
- runFlow: ../../subflows/fresh_launch.yaml
- runFlow: ../../subflows/to_home.yaml
- runFlow:
    file: ../../subflows/add_spend.yaml
    env: { AMOUNT: "12", CAT: "food" }
# To the launcher's home screen, then its widget picker
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn:
    point: "50%,45%"
- tapOn:
    text: "Widgets"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 92-picker
- tapOn:
    text: "(?i)Search.*"
    optional: true
- inputText: "Piggybow"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
# The app's entry, "Piggybow Staging" (the rows' builds are staging; prod's
# label is "Piggybow"). A bare "Piggybow" hit the search box's own text in
# dry run 1; index 0 is the entry's title line, its subtitle repeats it
- tapOn:
    text: "Piggybow Staging"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 92-picker-piggybow
# Pixel Launcher (Android 12+) shows an Add button for a tapped preview
- tapOn:
    text: "(?i).*Today.s spending and your goal.*"
    optional: true
- tapOn:
    text: "(?i)Add"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 92-placed
- assertVisible: "${EXPECT}"
# A tap on the widget's body opens the app
- tapOn: "${EXPECT}"
- extendedWaitUntil:
    visible:
      id: "home-add|lock-screen"
    timeout: 15000
- takeScreenshot: ${SHOT}
