appId: ${APP_ID}
name: The home-screen widget (#72, group D), part 1 - a spend today, then Pixel Launcher's widget picker with Piggybow's entry open (its 3×2 preview, name and description); the row script drags the preview onto the home screen
tags: [widget]
# Run by group-d.sh. This launcher shows no "Add" button for a tapped
# preview (dry runs 1 and 2): the script long-presses and drags it with
# `input draganddrop`, which Maestro can't, then flow 92b reads the widget.
---
- runFlow: ../../subflows/fresh_launch.yaml
- runFlow: ../../subflows/to_home.yaml
- runFlow:
    file: ../../subflows/add_spend.yaml
    env: { AMOUNT: "12", CAT: "food" }
# To the launcher's home screen, then its widget picker
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn:
    point: "50%,45%"
- tapOn:
    text: "Widgets"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "(?i)Search.*"
    optional: true
- inputText: "Piggybow"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
# The app's entry, "Piggybow Staging" (the rows' builds are staging; prod's
# label is "Piggybow"). A bare "Piggybow" hit the search box's own text in
# dry run 1; index 0 is the entry's title line, its subtitle repeats it
- tapOn:
    text: "Piggybow Staging"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "com.google.android.apps.nexuslauncher:id/widget_preview_container"
- assertVisible: "Today's spending and your goal"
- assertVisible: "3 × 2"
- takeScreenshot: 92-picker-piggybow
