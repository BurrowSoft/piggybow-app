appId: ${APP_ID}
name: PR 5 the reminder offer - never before the first entry; Yes turns it on at 8 PM and asks for permission (Allow); answered once
tags: [pb1, reminder]
---
- runFlow: ../../subflows/fresh_launch_notif_unset.yaml
- runFlow: ../../subflows/to_home.yaml
- assertNotVisible:
    id: home-reminder-yes             # not before the first entry
- runFlow: ../../subflows/add_first_spend.yaml
- extendedWaitUntil:
    visible:
      id: home-reminder-yes
    timeout: 10000
- assertVisible:
    id: home-reminder-yes
    text: ".*Remind me at 8:00.PM.*"  # 20:00 in en_US (intl may use a narrow no-break space before PM)
- tapOn:
    id: home-reminder-yes
- extendedWaitUntil:
    visible: "Allow"                  # Android 13+'s permission dialog (system UI)
    timeout: 10000
- tapOn: "Allow"
- assertNotVisible:
    id: home-reminder-yes             # answered
- tapOn:
    id: tab-me
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: me-reminder
- assertVisible:
    id: me-reminder
    checked: true
- assertVisible:
    id: me-reminder-time
    text: ".*8:00.PM.*"
- assertNotVisible: ".*Notifications are off for Piggybow.*"
# Answered once: not offered again after a relaunch
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-pig
    timeout: 20000
- assertNotVisible:
    id: home-reminder-yes
