appId: ${APP_ID}
name: Backup file (#87, P5) - the share sheet dismissed - the backup screen stays, both passwords kept, no message
tags: [backup]
# Run by pr87.sh right after 91a, with the share sheet still open. The script
# then checks cache/export is empty.
---
- back                                             # dismiss the share sheet
- extendedWaitUntil:
    visible:
      id: backup-screen
    timeout: 10000
- assertNotVisible:
    id: backup-error
# Both passwords kept: 21 dots each ("correct horse battery"), read by text:
# the dots sit on the field's node before #104 and on a child after it (the
# id becomes a container), so two matches (index 0 and 1) mean both fields
- assertVisible:
    id: backup-password
- assertVisible:
    id: backup-again
- assertVisible:
    text: "•{21}"
    index: 0
- assertVisible:
    text: "•{21}"
    index: 1
- takeScreenshot: 91-backup-dismissed
- back
- extendedWaitUntil:
    visible:
      id: me-backup
    timeout: 10000
