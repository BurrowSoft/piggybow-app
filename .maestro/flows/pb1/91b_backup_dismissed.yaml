appId: ${APP_ID}
name: Backup file (#87, P5) - the share sheet dismissed - the backup screen stays, both passwords kept, no message
tags: [backup]
# Run by pr87.sh right after 91a, with the share sheet still open. The script
# then checks cache/export is empty.
---
- back                                             # dismiss the share sheet
- extendedWaitUntil:
    visible:
      id: backup-screen
    timeout: 10000
- assertNotVisible:
    id: backup-error
# Both passwords kept: 21 dots each ("correct horse battery"). The eye
# (backup-show) has no node of its own in the hierarchy, so the length is read
- assertVisible:
    id: backup-password
    text: "•{21}"
- assertVisible:
    id: backup-again
    text: "•{21}"
- takeScreenshot: 91-backup-dismissed
- back
- extendedWaitUntil:
    visible:
      id: me-backup
    timeout: 10000
