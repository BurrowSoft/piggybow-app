appId: ${APP_ID}
name: Plus's paywall at large text (group A, plus-rows) - at font scale 2.0, the benefits, the yearly plan and its price whole, for a look
tags: [plus]
---
- launchApp:
    appId: ${APP_ID}
    stopApp: false
- runFlow: ../../subflows/to_home.yaml         # through onboarding if it's a fresh start
# The flow before ends on Me, scrolled down (Home's Add button isn't there):
# wait for the tabs, then scroll straight up to Plus, the first row (at ×2
# Me is long: reveal's 4 s down-then-up can end short of the top)
- extendedWaitUntil:
    visible:
      id: tab-me
    timeout: 30000
- tapOn:
    id: tab-me
- scrollUntilVisible:
    element:
      id: me-plus
    direction: UP
    timeout: 20000
- tapOn:
    id: me-plus
- extendedWaitUntil:
    visible:
      id: plus-screen
    timeout: 10000
- takeScreenshot: 87-paywall-x2
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: plus-plan-yearly-start
- takeScreenshot: 87-paywall-plan-x2
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: plus-privacy
- takeScreenshot: 87-paywall-end-x2
- back
