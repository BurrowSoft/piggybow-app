appId: ${APP_ID}
name: Plus's gates (group A, plus-rows) - without Plus, a second goal and your own category each open the paywall and change nothing; hiding a built-in category stays free (the themes' gate is 87d)
tags: [plus]
# Run with kind=plus-rows and zone UTC. Plus stays off: the fake store never
# owns anything.
---
- runFlow: ../../subflows/fresh_launch.yaml
- runFlow: ../../subflows/to_home.yaml
# A first goal is free; a second one opens the paywall
- runFlow:
    file: ../../subflows/create_goal.yaml
    env: { NAME: "Bike", AMOUNT: "500", START: "0" }
- back                                             # the goal screen sits over the tabs
- extendedWaitUntil:
    visible:
      id: home-add
    timeout: 10000
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: home-new-goal
- tapOn:
    id: home-new-goal
- extendedWaitUntil:
    visible:
      id: plus-screen
    timeout: 10000
- takeScreenshot: 87-gate-goal
- back
- extendedWaitUntil:
    visible:
      id: home-new-goal
    timeout: 10000
- assertNotVisible:
    id: goal-name                                  # no new-goal form behind it
# Categories: hiding a built-in is free
- tapOn:
    id: tab-me
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: me-categories
- tapOn:
    id: me-categories
- extendedWaitUntil:
    visible:
      id: categories-screen
    timeout: 10000
- assertVisible: "Built-in"
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: categories-transport-toggle
- tapOn:
    id: categories-transport-toggle
- assertVisible:
    id: categories-transport
- assertVisible: "(?s)Transport\\s+Hidden"            # one merged row: the name, then "Hidden"
- takeScreenshot: 87-categories-hidden
# Your own category opens the paywall
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: categories-add
- tapOn:
    id: categories-add
- extendedWaitUntil:
    visible:
      id: plus-screen
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: categories-screen
    timeout: 10000
- assertNotVisible:
    id: category-edit-screen
# The hidden category is gone from Add; show it again
- back
- tapOn:
    id: tab-home
- tapOn:
    id: home-add
- assertNotVisible:
    id: add-cat-transport
- assertVisible:
    id: add-cat-food
- tapOn:                                         # Cancel (Back would only close the keyboard)
    id: add-back
- extendedWaitUntil:
    visible:
      id: home-add
    timeout: 10000
- tapOn:
    id: tab-me
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: me-categories
- tapOn:
    id: me-categories
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: categories-transport-toggle
- tapOn:
    id: categories-transport-toggle
- assertNotVisible: "(?s)Transport\\s+Hidden"
- back
- extendedWaitUntil:
    visible:
      id: me-categories
    timeout: 10000
