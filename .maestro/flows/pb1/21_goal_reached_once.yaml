appId: ${APP_ID}
name: PR 3 goal reached - the celebration shows once, Home shows Reached, the goal is read-only, no second celebration after a relaunch
tags: [pb1, goal]
---
- runFlow: ../../subflows/fresh_launch.yaml
- runFlow: ../../subflows/to_home.yaml
- runFlow:
    file: ../../subflows/create_goal.yaml
    env:
      NAME: "Bike"
      AMOUNT: "100"
      START: "0"
- extendedWaitUntil:
    visible:
      id: goal-screen
    timeout: 10000
- runFlow:
    file: ../../subflows/add_savings.yaml
    env:
      AMOUNT: "100"
      GOAL: "Bike"
# The full-screen celebration, once
- extendedWaitUntil:
    visible:
      id: goal-done-screen
    timeout: 10000
- assertVisible: ".*You did it!.*"
- assertVisible: ".*Bike.*Every bit of it was you.*"
- takeScreenshot: goal-done
- tapOn:
    id: goal-done-close
# Home: no active goal; the empty card (no id; its button is goal-create)
# with "Reached: Bike" (goal-card-reached, a 48 dp tap target); the goal line
- extendedWaitUntil:
    visible:
      id: goal-card-reached
      text: ".*Reached: Bike.*"
    timeout: 10000
- assertVisible:
    id: goal-create
- assertVisible:
    id: home-pig
    text: "(?i).*delighted.*"          # the label: "Your pig looks delighted."
- assertVisible:
    id: home-pig-line
    text: ".*You reached Bike!.*"
# A new save attaches to no goal
- tapOn:
    id: home-add
- tapOn:
    id: add-seg-saved
- assertVisible: ".*No goal yet. It still counts as saved.*"
- tapOn:
    id: add-back
# Read-only: "Reached: Bike" opens the reached goal's detail with no menu
# (so no Edit / End goal) and no Add savings (#18 @ 19222ad)
- tapOn:
    id: goal-card-reached
- extendedWaitUntil:
    visible:
      id: goal-screen
    timeout: 10000
- assertVisible: "Rainbow 100% filled.*"
- assertNotVisible:
    id: goal-menu
- assertNotVisible:
    id: goal-add-savings
- takeScreenshot: 21-reached-read-only
- back
# Relaunch: no second celebration
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-pig
    timeout: 20000
- assertNotVisible:
    id: goal-done-screen
