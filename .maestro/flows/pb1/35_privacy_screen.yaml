appId: ${APP_ID}
name: PR 4 Your privacy in a build without a Sentry DSN - lines 1, 2, 4, 5 and no crash-report line; the full policy's link and Me's Help & contact row (PRIVACY_URL and SUPPORT_URL set, #86)
tags: [pb1, me]
---
- runFlow: ../../subflows/fresh_launch.yaml
- runFlow: ../../subflows/to_home.yaml
- tapOn:
    id: tab-me
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: me-privacy
- tapOn:
    id: me-privacy
- assertVisible: ".*stored on this phone, and in your phone's own backup.*"
- assertVisible: ".*no account and no server for your money notes.*"
- assertVisible: ".*erases everything Piggybow stored on this phone.*"
- assertVisible: ".*No ads, no tracking.*"
- assertNotVisible: ".*crash report.*"          # privacy3 only with a DSN
# The full policy's link, after the last line, since PRIVACY_URL is set in
# every flavor (#86); flow 35c opens it
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: privacy-policy
- assertVisible:
    id: privacy-policy
- assertVisible: ".*Read the full privacy policy.*"
- takeScreenshot: 35-your-privacy
- tapOn: "Back"                    # the app bar arrow
# Help & contact: shown since SUPPORT_URL is set for staging and prod (#86);
# flow 35b opens it
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: me-help
- assertVisible:
    id: me-help
- assertVisible: ".*Help & contact.*"
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: me-version
- assertVisible:
    id: me-version
    text: "Version .* \\(.*\\)"
