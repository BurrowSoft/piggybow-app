appId: ${APP_ID}
name: Backup file (#87, P2 and P6) - Me → Restore from a file → ${FILE} → the password ${PASSWORD} → "This password doesn't open this backup. Check it and try again."; the password stays
tags: [backup]
# env: FILE (the start of the picked file's name), PASSWORD, DOTS (a regex
# for the kept field, e.g. "•{19}"), SHOT
# P2: the real backup, a wrong password. P6: a copy with one byte changed,
# the right password: the same line, no crash.
---
- launchApp:
    appId: ${APP_ID}
    stopApp: false
- extendedWaitUntil:
    visible:
      id: tab-me
    timeout: 30000
- tapOn:
    id: tab-me
- runFlow:
    file: ../../subflows/reveal.yaml
    env:
      ID: me-restore
- tapOn:
    id: me-restore
- extendedWaitUntil:
    visible:
      id: restore-screen
    timeout: 10000
- tapOn:
    id: restore-choose
- runFlow:
    file: ../../subflows/pick_download.yaml
    env: { FILE: "${FILE}" }
- extendedWaitUntil:
    visible:
      id: restore-password
    timeout: 15000
- runFlow:
    file: ../../subflows/paste_into.yaml
    env:
      ID: restore-password
      TEXT: "${PASSWORD}"
      EXPECT: ".*"
- tapOn:
    id: restore-go
- extendedWaitUntil:
    visible:
      id: restore-error
    timeout: 60000
- assertVisible: ".*This password doesn't open this backup\\. Check it and try again\\..*"
# The password kept: as many dots as it has characters (${DOTS}); the eye
# has no node of its own in the hierarchy
- assertVisible:
    id: restore-password
    text: "${DOTS}"
- takeScreenshot: ${SHOT}
- back
- extendedWaitUntil:
    visible:
      id: me-restore
    timeout: 10000
