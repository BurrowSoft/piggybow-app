appId: ${APP_ID}
name: Play shot 3 - Summary, this week (STORE1) - Nov 16 to Nov 22, the totals, the plan bar, five categories, the worth line
tags: [play]
---
- runFlow:
    file: ../../subflows/store_launch.yaml
    env: { CASE: "STORE1" }
- tapOn:
    id: tab-summary
- tapOn:
    id: sum-week
- assertVisible:
    id: sum-period-label
    text: ".*Nov 16.*Nov 22.*"
# The totals' values sit on a child of sum-spent / sum-saved ("Spent\n$162.90")
- assertVisible: "(?s).*Spent.*\\$162\\.90.*"
- assertVisible: "(?s).*Saved.*\\$60\\.00.*"
- assertVisible: "(?s).*Groceries.*\\$62\\.40 · 38%.*"
- waitForAnimationToEnd
- runFlow: ../../subflows/dismiss_system_anr.yaml   # never a launcher dialog in a store shot
- takeScreenshot: play-03-summary
