appId: ${APP_ID}
name: Play shot 6 - Welcome (O1), a fresh install with no fixture - the pig under the rainbow, Meet your money pig, US dollar
tags: [play]
---
- retry:
    maxRetries: 1
    commands:
      - stopApp
      - clearState
      - waitForAnimationToEnd:
          timeout: 2000
      - launchApp:
          permissions:
            notifications: deny
      - extendedWaitUntil:
          visible:
            id: "onb-welcome|android:id/aerr_wait"
          timeout: 120000
- runFlow: ../../subflows/dismiss_system_anr.yaml
- extendedWaitUntil:
    visible:
      id: "onb-welcome|android:id/aerr_wait"
    timeout: 60000
- runFlow: ../../subflows/dismiss_system_anr.yaml
- extendedWaitUntil:
    visible:
      id: onb-welcome
    timeout: 60000
- assertVisible: "Meet your money pig"
- assertVisible: ".*No bank login and no account\\. Your entries stay with you\\..*"
- assertVisible: ".*Amounts in US dollar.*"
- waitForAnimationToEnd
- runFlow: ../../subflows/dismiss_system_anr.yaml   # never a launcher dialog in a store shot
- takeScreenshot: play-06-welcome
